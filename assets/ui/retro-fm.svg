<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Retro FM — listen on Spotify</title>
  <desc id="desc">A lavender and pink retro radio panel with a prominent Spotify listening button.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1027"/>
      <stop offset="1" stop-color="#33203d"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" x2="1">
      <stop offset="0" stop-color="#f2a6c7"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 1H8" stroke="#ffffff" opacity=".06"/>
    </pattern>
  </defs>
  <rect x="16" y="16" width="1168" height="228" rx="28" fill="url(#bg)" stroke="#d9a7e8" stroke-width="5"/>
  <rect x="30" y="30" width="1140" height="200" rx="20" fill="url(#scan)"/>
  <circle cx="1086" cy="78" r="30" fill="#f6c0d8" stroke="#fff3f8" stroke-width="4"/>
  <circle cx="1086" cy="78" r="8" fill="#7c3aed"/>
  <path d="M1086 38V25M1086 131v-13M1046 78h-14M1140 78h-14" stroke="#f6c0d8" stroke-width="5" stroke-linecap="round"/>
  <text x="72" y="78" fill="#f7d7e8" font-family="Trebuchet MS, Arial Rounded MT Bold, sans-serif" font-size="32" font-weight="700" letter-spacing="5">RETRO FM</text>
  <text x="72" y="124" fill="#ffffff" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" letter-spacing="2">anime openings · retro sounds · late-night loops</text>
  <g transform="translate(72 156)">
    <rect x="0" y="0" width="310" height="48" rx="24" fill="url(#pink)"/>
    <circle cx="28" cy="24" r="15" fill="#1db954"/>
    <path d="M22 18 Q31 17 37 21 M22 24 Q30 23 36 26 M23 30 Q29 29 34 31" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <text x="58" y="31" fill="#281536" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700">LISTEN ON SPOTIFY</text>
  </g>
  <path d="M500 178 q18-42 36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0" fill="none" stroke="#e7a9ef" stroke-width="5" stroke-linecap="round"/>
  <text x="500" y="208" fill="#cbb9d4" font-family="monospace" font-size="14" letter-spacing="2">PRESS PLAY IN SPOTIFY ↗</text>
</svg>
